version: '3.8'

services:
  mariadb:
    build: ./requirements/mariadb
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception-net
    restart: on-failure
    env_file: .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MDB_USER}", "-p${MDB_USER_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  wordpress:
    build: ./requirements/wordpress
    volumes:
      - wp_data:/var/www/wordpress
    networks:
      - inception-net
    restart: on-failure
    expose:
      - "9000"
    depends_on:
      mariadb:
        condition: service_healthy
    env_file: .env
  nginx:
    build: ./requirements/nginx
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/wordpress
    networks:
      - inception-net
    restart: on-failure
    depends_on:
      - wordpress
    env_file: .env

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ddel-bla/data/mariadb

  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ddel-bla/data/wordpress

networks:
  inception-net:
    driver: bridge
